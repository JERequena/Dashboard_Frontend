<section class="dashboard-filters">
  @for (filtro of filtros(); track filtro.id) {
    <div
      class="dashboard-filter"
      [class.open]="filtroAbierto === filtro.id">

      <button
        class="filter-trigger"
        type="button"
        (click)="alternarFiltro(filtro.id, $event)">

        <span>{{ filtro.label }}</span>

        <i class="fa-solid fa-chevron-down"></i>
      </button>

      <div
        class="filter-menu"
        (click)="$event.stopPropagation()">

        @for (opcion of filtro.opciones; track opcion) {
          <label>
            <input type="checkbox">
            <span>{{ opcion }}</span>
          </label>
        }

      </div>
    </div>
  }
</section>
